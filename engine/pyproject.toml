[project]
name = "plan-diff"
version = "0.0.0"
description = "Turn public carrier benefit PDFs into one canonical plan schema with page provenance, then diff plan years. Public data only."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "polars",
    "duckdb",
    "pydantic>=2",
    "typer",
    "rich",
    "httpx",
]

[project.scripts]
plan-diff = "plan_diff.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plan_diff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
